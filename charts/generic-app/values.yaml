# ------------------------------------------------------------------
# Výchozí hodnoty pro generic-app chart.
# Hodnoty se přepisují per-aplikace v argocd-apps/templates/applications.yaml
# (přes helm.valuesObject), a per-prostředí v envs/<env>/values.yaml.
# ------------------------------------------------------------------

# Pokud je prázdné, použije se .Chart.Name. V App of Apps předáváme jméno aplikace.
nameOverride: ""

image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

# Pod-level security context - strictly non-root
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context - hardened for bank requirements
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}

# Pole env proměnných (secret patří do External Secrets, viz README).
env: []
# - name: LOG_LEVEL
#   value: info

probes:
  liveness:
    enabled: true
    spec:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20
  readiness:
    enabled: true
    spec:
      httpGet:
        path: /ready
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
