apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/example-org/k8s-gitops.git
      targetRevision: main
      path: argocd-apps
      helm:
        valueFiles:
          - $values/envs/stage/values.yaml
    - repoURL: https://github.com/example-org/k8s-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
