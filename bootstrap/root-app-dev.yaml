# ------------------------------------------------------------------
# Root Application pro DEV. Toto je JEDINÝ objekt, který se aplikuje
# ručně (kubectl apply -f) - vše ostatní pak ArgoCD vytváří samo.
#
# Multi-source pattern: chart leží v argocd-apps/, ale values přebírá
# z envs/dev/values.yaml (oba ze stejného repa). To je modernější
# alternativa k "../envs/dev/values.yaml", které ArgoCD blokuje
# z bezpečnostních důvodů (--allow-oob-symlinks).
# ------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/example-org/k8s-gitops.git
      targetRevision: main
      path: argocd-apps
      helm:
        valueFiles:
          - $values/envs/dev/values.yaml
    - repoURL: https://github.com/example-org/k8s-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
