{{- $global := .Values.global -}}
{{- range $app := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name }}-{{ $global.environment }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $global.argocdProject }}
  source:
    repoURL: {{ $global.repoURL }}
    targetRevision: {{ $global.targetRevision }}
    path: {{ $global.chartPath }}
    helm:
      releaseName: {{ $app.name }}
      valuesObject:
        nameOverride: {{ $app.name }}
        replicas: {{ $app.replicas | default 1 }}
        image:
          repository: {{ $app.image.repository }}
          tag: {{ $app.image.tag | quote }}
        {{- with $app.containerPort }}
        containerPort: {{ . }}
        {{- end }}
        {{- with $app.service }}
        service:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $app.ingress }}
        ingress:
          enabled: {{ $app.ingress.enabled | default false }}
          className: {{ $app.ingress.className | default "nginx" }}
          host: {{ printf "%s.%s" $app.name $global.domain }}
          path: {{ $app.ingress.path | default "/" }}
          pathType: {{ $app.ingress.pathType | default "Prefix" }}
          {{- with $app.ingress.annotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.ingress.tls }}
          tls:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with $app.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.podSecurityContext }}
        podSecurityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.probes }}
        probes:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $app.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $podAnnotations := merge (dict) ($app.podAnnotations | default (dict)) ($global.podAnnotations | default (dict)) }}
        {{- if $podAnnotations }}
        podAnnotations:
          {{- toYaml $podAnnotations | nindent 10 }}
        {{- end }}
        {{- $podLabels := merge (dict) ($app.podLabels | default (dict)) ($global.podLabels | default (dict)) }}
        {{- if $podLabels }}
        podLabels:
          {{- toYaml $podLabels | nindent 10 }}
        {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $global.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
