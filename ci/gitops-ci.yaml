# ------------------------------------------------------------------
# Self-validation CI tohoto GitOps repa.
# Pozor: toto NENÍ "CI pipeline před GitOps repem" popsaná v README -
# to by byla CI aplikačního zdrojáku, která bumpne tag v envs/. Toto je
# CI, která validuje obsah TOHOTO repa na každý PR a merge do main.
# ------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - charts/*
      - argocd-apps/*
      - envs/*

pr:
  branches:
    include:
      - main
  paths:
    include:
      - charts/*
      - argocd-apps/*
      - envs/*

variables:
  # Variable group navázaná na Azure Key Vault (žádné secrety v pipeline yaml).
  - group: vg-kubernetes-gitops-secrets
  # Service Connection přes OIDC (Workload Identity Federation, žádný client secret).
  - name: azureServiceConnection
    value: 'sc-azure-workload-identity'
  - name: acrName
    value: 'acrgitopsbankprod.azurecr.io'

stages:
  - stage: Validation
    displayName: 'Statická analýza a validace'
    jobs:
      - job: HelmLint
        displayName: 'Helm chart lint'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/helm-lint.yaml
            parameters:
              chartPath: 'charts/generic-app'
              chartName: 'generic-app'
          - template: templates/helm-lint.yaml
            parameters:
              chartPath: 'argocd-apps'
              chartName: 'argocd-apps'

      - job: SecurityAndCompliance
        displayName: 'Bezpečnostní a compliance sken'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/security-scan.yaml
            parameters:
              serviceConnection: $(azureServiceConnection)
              azureContainerRegistry: $(acrName)
