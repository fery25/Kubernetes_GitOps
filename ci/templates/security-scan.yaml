parameters:
  - name: serviceConnection
    type: string
  - name: azureContainerRegistry
    type: string

steps:
  # Kubeconform validuje rendered K8s manifesty proti OpenAPI schématu.
  # Pozor: nelze ho spustit přímo na Helm templates ({{ }} placeholders nejsou
  # validní YAML) - musíme nejdřív vyrenderovat a pipnout. ArgoCD CRDs (Application)
  # nejsou v defaultním kubeconform schema setu, proto -ignore-missing-schemas.
  - script: |
      echo "=== Kubeconform schema validation ==="
      curl -L -s https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
      chmod +x kubeconform

      echo "--- generic-app (default values) ---"
      helm template test charts/generic-app/ | ./kubeconform -summary -ignore-missing-schemas -

      for env in dev stage prod; do
        echo "--- argocd-apps + envs/${env} ---"
        helm template root argocd-apps/ -f envs/${env}/values.yaml | \
          ./kubeconform -summary -ignore-missing-schemas -
      done
    displayName: 'Kubeconform schema validation'

  # Trivy config sken hledá misconfigurace v Helm šablonách (priv-escalation,
  # missing securityContext, host network apod). Blokující na HIGH/CRITICAL.
  - script: |
      echo "=== Trivy security scan na Helm charts ==="
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b .
      ./trivy config --exit-code 1 --severity HIGH,CRITICAL charts/generic-app/
      ./trivy config --exit-code 1 --severity HIGH,CRITICAL argocd-apps/
    displayName: 'Trivy IaC/Helm sken'
